[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp2-trieste-hands-on"
version = "0.1.0"
description = "LSST DP2 analysis of variable objects - Trieste Regional Workshop (August 2026)"
readme = "docs/SPEC_V01.md"
requires-python = ">=3.14,<3.15"

