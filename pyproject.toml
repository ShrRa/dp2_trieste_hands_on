# src/visualization now has real code (the interactive scatter+LC explorer, nb_05); src/io is
# still unused. On RSP, notebooks import this by adding `src/` to sys.path directly rather than
# via `pip install .` — the pinned Python 3.14 here is newer than RSP's kernel (see README).
[tool.setuptools]
package-dir = {"" = "src"}
packages = ["visualization"]
